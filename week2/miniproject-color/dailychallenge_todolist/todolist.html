<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>To-Do List</title>

  <!-- Font Awesome for the X icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <h1 class="title">TO-DO LIST</h1>

    <section class="card">
      <form id="taskForm" class="task-form">
        <input id="taskInput" type="text" placeholder="new task" autocomplete="off" />
        <button type="submit" class="add-btn">ADD</button>
      </form>

      <div class="divider"></div>

      <!-- REQUIRED This is an empty container.It is the place where all new tasks will appear.-->
      <div class="listTasks" id="listTasks"></div>

      <button id="clearBtn" class="clear-btn" type="button">Clear</button>
    </section>
  </main>

  <script src="todolist.js"></script>
</body>
</html>
