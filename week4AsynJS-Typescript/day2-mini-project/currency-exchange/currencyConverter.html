<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
</head>
<body>
    <h1>Currency Converter</h1>
    <div id = "converter">
        <label for="fromCurrency">From:</label>  <!-- label It tells the user what this input is for "From: [ USD ▼ ]" for="fromCurrency" connects to:<select id="fromCurrency">-->
        <select id="fromCurrency"></select>

        <label for="toCurrency">To:</label>
        <select id="toCurrency"></select>

        <label for="amount">Amount:</label>
        <input type="number" id="amount" placeholder="Enter amount" /> 

        <button id="convertBtn">Convert</button>
        <button id="switchBtn">Switch</button>
        <div id="result"></div>
    </div>

    <script src = "currencyConverter.js"></script>
</body>
</html>
