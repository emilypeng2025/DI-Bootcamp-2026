<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robo Friends</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.cdnfonts.com/css/sega-logo-font" rel="stylesheet">
</head>
<body>
    <h1 id="title">Robo Friends</h1>
    <input type="text" id="searchBox" placeholder="Search robots..." /> 
        <!-- This creates a text input field on the webpage. it is basically a search bar where users can type text.
                这行代码创建了一个输入框。可以理解为一个搜索栏，用户可以在里面输入文字。
                <input> is an HTML element used to collect data from users.
                    <input> 的作用是 用户输入框, e.g. 	•输入文字 •输入邮箱 •选择复选框	•selecting a checkbox •上传文件
                    type tells the browser what kind of input field it is.
                        type="text"      → normal typing
                        type="password"  → hidden characters
                        type="email"     → email validation
                        type="number"    → numbers only 
                    type 用来告诉浏览器 输入框是什么类型。
                What is placeholder? placeholder is light grey hint text inside the input box. 
                It helps users understand what to type.
-->
    <div id="card-container"></div>


    <script src="script.js"></script>

</body>
</html>
