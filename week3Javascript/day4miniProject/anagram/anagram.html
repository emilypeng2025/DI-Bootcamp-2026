// Some Help

// What is an anagram?
// An anagram is another word or phrase formed by rearranging letters of the first word or phrase.


// Example of anagrams

// "Astronomer" is an anagram of "Moon starer"
// "School master" is an anagram of "The classroom"
// "The Morse Code" is an anagram of "Here come dots"

function comparing(string1, string2){
    const cleanString1 = string1.toLowerCase().replace(/\s/g, "");
    const cleanString2 = string2.toLowerCase().replace(/\s/g, "");

    const sortString1 = cleanString1.split("").sort()
    const sortString2 = cleanString2.split("").sort()

    const sorted1 = sortString1.join("")
    const sorted2 = sortString2.join("")
    
    if (sorted1 === sorted2){
        return `${string1} is an anagram of ${string2}`;
    } else {
        return `${string1} is not an anagram of ${string2}`
    };
}
