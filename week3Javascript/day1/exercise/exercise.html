// 🌟 Exercise 1 : Colors
// Instructions

const colors = ["Blue", "Green", "Red", "Orange", "Violet", "Indigo", "Yellow"];
// Write a JavaScript program that displays the colors in the following order : “1# choice is Blue.” “2# choice is Green.” “3# choice is Red.” ect…

//My answer: 1. use .map() method because i need to copy the array and made a new array with changes of putting the sentences. 
// 2. or i can just use .forEach method that can get to the index of each element, loop the array and console.log each element with (`${index}`# choice is `${element}`)

    // console.log(`${index+1}` + "# choice is " + `${color}`)
    console.log(`${index + 1}# choice is ${color}`);
});

// 🌟 Exercise 2 : Colors #2
// Instructions
// Using these arrays :

// const colors = ["Blue", "Green", "Red", "Orange", "Violet", "Indigo", "Yellow"];
const ordinal = ["th","st","nd","rd"];
// Write a JavaScript program that displays the colors in the following order : “1st choice is Blue .” “2nd choice is Green.” “3rd choice is Red.” ect…
// Hint : Use the array methods taught in class and ternary operator.
//1️⃣ 遍历数组 use .forEach() 2️⃣ 给数字加 序数后缀（st / nd / rd / th）
//The ternary operator is a short way to write an if...else statement in one line.
//1️⃣ Basic Syntax: condition ? value_if_true : value_if_false
// here:
// condition1 ? result1
// : condition2 ? result2
// : condition3 ? result3
// : default_result


colors.forEach((color, index) => {
    let position = index + 1;
    let suffix = position === 1 ? ordinal[1]
               : position === 2 ? ordinal[2]
               : position === 3 ? ordinal[3]
               : ordinal[0];

    console.log(`${position}${suffix} choice is ${color}`);

})

// 🌟 Exercise 4 : Employees
// Instructions

const users = [{ firstName: 'Bradley', lastName: 'Bouley', role: 'Full Stack Resident' },
             { firstName: 'Chloe', lastName: 'Alnaji', role: 'Full Stack Resident' },

// 2. Using the filter() method, create a new array, containing only the Full Stack Residents.
//What filter() does? filter() returns a new array containing only the elements that match the condition.

const fullStackResidents = users.filter(user => user.role ==="Full Stack Resident")
// 3. Bonus : Chain the filter method with a map method, to return an array containing only the lastName of the Full Stack Residents.

    .filter(user => user.role === "Full Stack Resident")
    .map(user => user.lastName);
console.log(fullStaackNames);
